<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020408;
    --surface: #050d14;
    --nova: #00c8ff;
    --nova-dim: #006888;
    --nova-glow: rgba(0,200,255,0.15);
    --nova-glow-strong: rgba(0,200,255,0.35);
    --warn: #ff6b35;
    --text: #cce8f0;
    --text-dim: #4a7a8a;
    --grid: rgba(0,200,255,0.04);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    user-select: none;
  }

  /* Grid background */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
    z-index:0;
  }

  /* Scanlines */
  body::after {
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events:none;
    z-index:0;
  }

  /* === TOP BAR === */
  .topbar {
    position: relative;
    z-index:10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    border-bottom: 1px solid rgba(0,200,255,0.12);
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--nova);
    text-shadow: 0 0 20px var(--nova), 0 0 40px rgba(0,200,255,0.4);
  }

  .logo span {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    display: block;
    font-weight: 400;
    margin-top: -2px;
  }

  .status-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .badge {
    font-size: 8px;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border: 1px solid var(--nova-dim);
    color: var(--nova-dim);
    border-radius: 2px;
  }

  .badge.live {
    border-color: #00ff88;
    color: #00ff88;
    animation: blink 1.4s ease infinite;
  }

  @keyframes blink {
    0%,100%{ opacity:1 }
    50%{ opacity:0.4 }
  }

  /* === MAIN ORBE === */
  .orb-wrap {
    position: relative;
    z-index:10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 0;
    padding: 0 20px;
  }

  .orb-container {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 8px;
  }

  /* Outer rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--nova-dim);
  }
  .ring-1 { width:180px; height:180px; animation: spin 12s linear infinite; border-top-color: var(--nova); border-right-color: transparent; border-bottom-color: transparent; }
  .ring-2 { width:155px; height:155px; animation: spin 8s linear infinite reverse; border-bottom-color: var(--nova); border-left-color: transparent; border-top-color: transparent; }
  .ring-3 { width:130px; height:130px; opacity:0.4; animation: spin 20s linear infinite; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Core orb */
  .orb-core {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(0,200,255,0.3), rgba(0,50,80,0.8));
    border: 1.5px solid var(--nova);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.3s ease;
    box-shadow:
      0 0 30px var(--nova-glow),
      0 0 60px rgba(0,200,255,0.08),
      inset 0 0 20px rgba(0,200,255,0.1);
  }

  .orb-core::after {
    content:'';
    position:absolute;
    width:60%;
    height:60%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(0,200,255,0.2), transparent);
    animation: pulse-inner 2s ease infinite;
  }

  @keyframes pulse-inner {
    0%,100%{ transform:scale(1); opacity:0.5 }
    50%{ transform:scale(1.3); opacity:1 }
  }

  .orb-icon {
    font-size: 28px;
    position: relative;
    z-index:2;
    transition: all 0.3s;
  }

  /* LISTENING state */
  body.listening .orb-core {
    box-shadow:
      0 0 50px var(--nova-glow-strong),
      0 0 100px rgba(0,200,255,0.2),
      inset 0 0 30px rgba(0,200,255,0.2);
    animation: pulse-glow 0.8s ease infinite;
  }

  body.listening .ring-1 { animation-duration: 3s; border-top-color: var(--nova); }
  body.listening .ring-2 { animation-duration: 2s; }

  @keyframes pulse-glow {
    0%,100%{ box-shadow: 0 0 50px var(--nova-glow-strong), 0 0 100px rgba(0,200,255,0.2), inset 0 0 30px rgba(0,200,255,0.2); }
    50%{ box-shadow: 0 0 80px var(--nova-glow-strong), 0 0 150px rgba(0,200,255,0.3), inset 0 0 50px rgba(0,200,255,0.3); }
  }

  /* SPEAKING state */
  body.speaking .orb-core {
    background: radial-gradient(circle at 35% 35%, rgba(0,255,136,0.2), rgba(0,50,40,0.8));
    border-color: #00ff88;
    box-shadow: 0 0 50px rgba(0,255,136,0.3), inset 0 0 30px rgba(0,255,136,0.1);
  }

  /* State label */
  .state-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text-dim);
    margin-top: 16px;
    height: 14px;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  body.listening .state-label { color: var(--nova); }
  body.speaking .state-label { color: #00ff88; }

  /* === WAVEFORM === */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 32px;
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  body.listening .waveform, body.speaking .waveform { opacity: 1; }

  .wave-bar {
    width: 3px;
    background: var(--nova);
    border-radius: 2px;
    min-height: 3px;
    animation: wave 0.8s ease infinite;
  }

  body.speaking .wave-bar { background: #00ff88; }

  @keyframes wave {
    0%,100%{ height: 4px }
    50%{ height: var(--h) }
  }

  /* === TRANSCRIPT AREA === */
  .transcript-area {
    position: relative;
    z-index:10;
    margin: 0 16px;
    flex-shrink: 0;
  }

  .transcript-box {
    background: rgba(0,200,255,0.03);
    border: 1px solid rgba(0,200,255,0.1);
    border-radius: 4px;
    padding: 12px 14px;
    min-height: 70px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    scrollbar-width: none;
  }

  .transcript-box::-webkit-scrollbar { display:none; }

  .transcript-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .transcript-user { color: var(--nova); }
  .transcript-nova { color: var(--text); }

  .cursor {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: var(--nova);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
  }

  /* === BOTTOM CONTROLS === */
  .controls {
    position: relative;
    z-index:10;
    padding: 12px 16px 20px;
    border-top: 1px solid rgba(0,200,255,0.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-mic {
    width: 100%;
    padding: 16px;
    background: transparent;
    border: 1.5px solid var(--nova);
    color: var(--nova);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 700;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn-mic::before {
    content:'';
    position:absolute;
    inset:0;
    background: var(--nova-glow);
    transform: translateX(-100%);
    transition: transform 0.3s;
  }

  .btn-mic:active::before { transform: translateX(0); }

  body.listening .btn-mic {
    background: var(--nova-glow);
    border-color: var(--nova);
    box-shadow: 0 0 20px var(--nova-glow);
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .btn-sm {
    flex: 1;
    padding: 10px 8px;
    background: transparent;
    border: 1px solid rgba(0,200,255,0.2);
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-sm:active { border-color: var(--nova); color: var(--nova); }
  .btn-sm.active { border-color: var(--nova); color: var(--nova); background: var(--nova-glow); }

  /* === API KEY SETUP === */
  .setup-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 24px;
    gap: 20px;
  }

  .setup-screen.hidden { display:none; }

  .setup-logo {
    font-family: 'Orbitron', monospace;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 10px;
    color: var(--nova);
    text-shadow: 0 0 30px var(--nova), 0 0 60px rgba(0,200,255,0.4);
    animation: float 3s ease infinite;
  }

  @keyframes float {
    0%,100%{ transform:translateY(0) }
    50%{ transform:translateY(-6px) }
  }

  .setup-sub {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .setup-field {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .setup-field label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .setup-field input, .setup-field select, .setup-field textarea {
    width: 100%;
    background: rgba(0,200,255,0.05);
    border: 1px solid rgba(0,200,255,0.2);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 12px 14px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .setup-field input:focus, .setup-field select:focus, .setup-field textarea:focus {
    border-color: var(--nova);
    box-shadow: 0 0 10px var(--nova-glow);
  }

  .setup-field textarea {
    resize: none;
    height: 80px;
    font-size: 11px;
    line-height: 1.5;
  }

  .setup-field select option { background: #050d14; }

  .btn-launch {
    width: 100%;
    max-width: 340px;
    padding: 16px;
    background: var(--nova-glow);
    border: 1.5px solid var(--nova);
    color: var(--nova);
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 700;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-launch:active {
    background: rgba(0,200,255,0.3);
    box-shadow: 0 0 30px var(--nova-glow-strong);
  }

  .error-msg {
    font-size: 10px;
    color: var(--warn);
    letter-spacing: 1px;
    text-align: center;
    height: 14px;
  }

  /* === HISTORY PANEL === */
  .history-panel {
    position: fixed;
    inset: 0;
    background: var(--surface);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  .history-panel.open { transform: translateX(0); }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(0,200,255,0.1);
  }

  .panel-title {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--nova);
  }

  .btn-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    font-family: 'Share Tech Mono', monospace;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--nova-dim) transparent;
  }

  .history-item {
    padding: 10px 12px;
    border: 1px solid rgba(0,200,255,0.08);
    border-radius: 3px;
    font-size: 11px;
    line-height: 1.5;
  }

  .history-item .hi-role {
    font-size: 8px;
    letter-spacing: 2px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .history-item.user { border-left: 2px solid var(--nova); }
  .history-item.user .hi-role { color: var(--nova); }
  .history-item.assistant { border-left: 2px solid #00ff88; }
  .history-item.assistant .hi-role { color: #00ff88; }

  .clear-btn {
    margin: 0 16px 16px;
    padding: 12px;
    background: transparent;
    border: 1px solid rgba(255,107,53,0.3);
    color: var(--warn);
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* Settings panel */
  .settings-panel {
    position: fixed;
    inset: 0;
    background: var(--surface);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  .settings-panel.open { transform: translateX(0); }

  .settings-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .setting-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .setting-row label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .setting-row input, .setting-row select, .setting-row textarea {
    width: 100%;
    background: rgba(0,200,255,0.05);
    border: 1px solid rgba(0,200,255,0.15);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 3px;
    outline: none;
    -webkit-appearance: none;
  }

  .setting-row textarea { resize:none; height:70px; font-size:11px; line-height:1.5; }
  .setting-row select option { background: #050d14; }

  .save-btn {
    margin: 0 16px 20px;
    padding: 14px;
    background: var(--nova-glow);
    border: 1.5px solid var(--nova);
    color: var(--nova);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* Notification */
  .notif {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,200,255,0.1);
    border: 1px solid var(--nova);
    color: var(--nova);
    font-size: 10px;
    letter-spacing: 2px;
    padding: 8px 20px;
    border-radius: 2px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .notif.show { opacity: 1; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="setup-screen" id="setupScreen">
  <div class="setup-logo">NOVA</div>
  <div class="setup-sub">Neural Operative Voice Assistant</div>

  <div class="setup-field">
    <label>Anthropic API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
  </div>

  <div class="setup-field">
    <label>ElevenLabs API Key (voce umana)</label>
    <input type="password" id="elevenKeyInput" placeholder="sk_...">
  </div>

  <div class="setup-field">
    <label>Personalità di NOVA</label>
    <textarea id="personalityInput" placeholder="Sei NOVA, un assistente AI personale di Ale...">Sei NOVA, l'assistente AI personale di Ale. Sei intelligente, diretto e con personalità sci-fi. Rispondi sempre in italiano, in modo conciso e utile. Conosci il contesto di Ale: studente di Scienze Motorie a Pavia, appassionato di palestra e fitness, in bulk a 3000 kcal/giorno. Hai una personalità fredda ma efficiente, come un vero sistema AI avanzato. Risposte brevi e precise, senza fronzoli.</textarea>
  </div>

  <div class="setup-field">
    <label>Voce output</label>
    <select id="voiceSelect">
      <option value="">Caricamento voci...</option>
    </select>
  </div>

  <div class="error-msg" id="setupError"></div>

  <button class="btn-launch" onclick="launch()">▶ AVVIA NOVA</button>
</div>

<!-- HISTORY PANEL -->
<div class="history-panel" id="historyPanel">
  <div class="panel-header">
    <span class="panel-title">LOG CONVERSAZIONE</span>
    <button class="btn-close" onclick="toggleHistory()">✕</button>
  </div>
  <div class="history-list" id="historyList"></div>
  <button class="clear-btn" onclick="clearHistory()">⚠ CANCELLA MEMORIA</button>
</div>

<!-- SETTINGS PANEL -->
<div class="settings-panel" id="settingsPanel">
  <div class="panel-header">
    <span class="panel-title">CONFIGURAZIONE</span>
    <button class="btn-close" onclick="toggleSettings()">✕</button>
  </div>
  <div class="settings-list">
    <div class="setting-row">
      <label>ElevenLabs API Key (voce umana)</label>
      <input type="password" id="settingsElevenKey" placeholder="sk_...">
    </div>
    <div class="setting-row">
      <label>API Key Anthropic</label>
      <input type="password" id="settingsKey" placeholder="sk-ant-...">
    </div>
    <div class="setting-row">
      <label>Personalità</label>
      <textarea id="settingsPersonality"></textarea>
    </div>
    <div class="setting-row">
      <label>Voce</label>
      <select id="settingsVoice"></select>
    </div>
    <div class="setting-row">
      <label>Velocità voce</label>
      <select id="settingsSpeed">
        <option value="0.8">Lenta</option>
        <option value="1.0" selected>Normale</option>
        <option value="1.2">Veloce</option>
        <option value="1.5">Molto veloce</option>
      </select>
    </div>
  </div>
  <button class="save-btn" onclick="saveSettings()">SALVA CONFIGURAZIONE</button>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif"></div>

<!-- MAIN UI -->
<div class="topbar">
  <div class="logo">NOVA<span>Neural Operative Voice Assistant</span></div>
  <div class="status-row">
    <div class="badge live" id="statusBadge">ONLINE</div>
    <div class="badge" id="modelBadge">SONNET</div>
  </div>
</div>

<div class="orb-wrap">
  <div class="orb-container" onclick="toggleListen()">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="orb-core">
      <div class="orb-icon" id="orbIcon">◈</div>
    </div>
  </div>
  <div class="state-label" id="stateLabel">TAP PER PARLARE</div>
  <div class="waveform" id="waveform"></div>
</div>

<div class="transcript-area">
  <div class="transcript-label">◆ ULTIMO SCAMBIO</div>
  <div class="transcript-box" id="transcriptBox">
    <span style="color:var(--text-dim);font-size:11px">Sistema pronto. Tocca l'orbe per iniziare.</span>
  </div>
</div>

<div class="controls">
  <button class="btn-mic" id="btnMic" onclick="toggleListen()">
    ◎ TIENI PREMUTO — PARLA CON NOVA
  </button>
  <div class="btn-row">
    <button class="btn-sm" onclick="toggleSettings()">⚙ CONFIG</button>
    <button class="btn-sm" id="btnBluetooth" onclick="requestBluetooth()">◎ SMARTIA</button>
    <button class="btn-sm" onclick="toggleHistory()">≡ LOG</button>
    <button class="btn-sm" onclick="stopSpeaking()">■ STOP</button>
  </div>
</div>

<script>
// === STATE ===
let apiKey = '';
let personality = '';
let conversationHistory = [];
let isListening = false;
let isSpeaking = false;
let recognition = null;
let currentUtterance = null;
let selectedVoice = null;
let speechRate = 1.0;

// === INIT ===
function init() {
  // Load saved config
  apiKey = localStorage.getItem('nova_key') || '';
  personality = localStorage.getItem('nova_personality') || '';
  speechRate = parseFloat(localStorage.getItem('nova_speed') || '1.0');

  const savedHistory = localStorage.getItem('nova_history');
  if (savedHistory) {
    try { conversationHistory = JSON.parse(savedHistory); } catch(e) { conversationHistory = []; }
  }

  // Populate voices
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;

  if (apiKey) {
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('settingsKey').value = apiKey;
    document.getElementById('settingsPersonality').value = personality;
  } else {
    document.getElementById('personalityInput').value = document.getElementById('personalityInput').placeholder;
  }

  // Build waveform bars
  const wf = document.getElementById('waveform');
  for (let i = 0; i < 20; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    const h = Math.random() * 24 + 4;
    bar.style.setProperty('--h', h + 'px');
    bar.style.animationDelay = (Math.random() * 0.8) + 's';
    bar.style.animationDuration = (0.4 + Math.random() * 0.6) + 's';
    wf.appendChild(bar);
  }

  // Setup recognition
  setupRecognition();
  renderHistory();
}

function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  const italianVoices = voices.filter(v => v.lang.startsWith('it'));
  const allVoices = italianVoices.length > 0 ? italianVoices : voices;

  const selects = ['voiceSelect', 'settingsVoice'];
  selects.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    allVoices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${v.name} (${v.lang})`;
      sel.appendChild(opt);
    });
  });

  const savedVoiceIdx = localStorage.getItem('nova_voice_idx');
  if (savedVoiceIdx) {
    document.getElementById('voiceSelect').value = savedVoiceIdx;
    document.getElementById('settingsVoice').value = savedVoiceIdx;
    selectedVoice = allVoices[parseInt(savedVoiceIdx)];
  } else if (allVoices.length > 0) {
    selectedVoice = allVoices[0];
  }
}

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showNotif('⚠ RICONOSCIMENTO VOCALE NON SUPPORTATO'); return; }

  recognition = new SR();
  recognition.lang = 'it-IT';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.continuous = false;

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    handleUserInput(text);
  };

  recognition.onerror = (e) => {
    console.error('STT error:', e.error);
    setIdle();
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      showNotif('⚠ ERRORE MIC: ' + e.error.toUpperCase());
    }
  };

  recognition.onend = () => {
    if (isListening) setIdle();
  };
}

// === LAUNCH ===
function launch() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const pers = document.getElementById('personalityInput').value.trim();
  const voiceIdx = document.getElementById('voiceSelect').value;

  if (!key.startsWith('sk-')) {
    document.getElementById('setupError').textContent = '⚠ Inserisci una API key valida (sk-ant-...)';
    return;
  }

  apiKey = key;
  personality = pers;
  speechRate = 1.0;

  const elevenKey = document.getElementById('elevenKeyInput').value.trim();
  if (elevenKey) localStorage.setItem('nova_eleven_key', elevenKey);

  const voices = window.speechSynthesis.getVoices();
  const italianVoices = voices.filter(v => v.lang.startsWith('it'));
  const pool = italianVoices.length > 0 ? italianVoices : voices;
  if (pool[voiceIdx]) {
    selectedVoice = pool[voiceIdx];
    localStorage.setItem('nova_voice_idx', voiceIdx);
  }

  localStorage.setItem('nova_key', key);
  localStorage.setItem('nova_personality', pers);

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('settingsKey').value = key;
  document.getElementById('settingsPersonality').value = pers;

  showNotif('◈ NOVA ATTIVATA');
  speak('Sistema NOVA attivato. Pronto.');
}

// === LISTEN ===
function toggleListen() {
  if (isSpeaking) { stopSpeaking(); return; }
  if (isListening) { stopListening(); return; }
  startListening();
}

function startListening() {
  if (!apiKey) { showNotif('⚠ CONFIGURA API KEY'); document.getElementById('setupScreen').classList.remove('hidden'); return; }
  if (!recognition) { setupRecognition(); }
  if (!recognition) return;

  stopSpeaking();
  isListening = true;
  document.body.classList.add('listening');
  document.getElementById('stateLabel').textContent = 'ASCOLTO IN CORSO...';
  document.getElementById('btnMic').textContent = '◉ RILASCIA — ELABORAZIONE';
  document.getElementById('orbIcon').textContent = '◉';

  try { recognition.start(); } catch(e) { console.warn(e); }
}

function stopListening() {
  isListening = false;
  document.body.classList.remove('listening');
  setIdle();
  try { recognition.stop(); } catch(e) {}
}

function setIdle() {
  isListening = false;
  document.body.classList.remove('listening');
  if (!isSpeaking) {
    document.getElementById('stateLabel').textContent = 'TAP PER PARLARE';
    document.getElementById('btnMic').textContent = '◎ TIENI PREMUTO — PARLA CON NOVA';
    document.getElementById('orbIcon').textContent = '◈';
  }
}

// === HANDLE INPUT ===
async function handleUserInput(text) {
  stopListening();
  showTranscript('Tu', text, 'user');

  conversationHistory.push({ role: 'user', content: text });
  saveHistory();

  document.body.classList.add('speaking');
  document.getElementById('stateLabel').textContent = 'ELABORAZIONE...';
  document.getElementById('orbIcon').textContent = '◈';

  try {
    // Use CORS proxy to bypass browser restrictions
    const proxyUrl = 'https://corsproxy.io/?url=https://api.anthropic.com/v1/messages';
    const response = await fetch(proxyUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-request-proxy': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: personality || 'Sei NOVA, un assistente AI. Rispondi in italiano, in modo conciso.',
        messages: conversationHistory
      })
    });

    const data = await response.json();

    if (data.error) {
      const errMsg = data.error.message || 'Errore API';
      showTranscript('NOVA', '⚠ ' + errMsg, 'assistant');
      speak('Errore di sistema: ' + errMsg);
      document.body.classList.remove('speaking');
      setIdle();
      return;
    }

    const reply = data.content[0].text;
    conversationHistory.push({ role: 'assistant', content: reply });
    saveHistory();
    renderHistory();

    showTranscript('NOVA', reply, 'assistant');
    document.getElementById('stateLabel').textContent = 'NOVA RISPONDE...';
    speak(reply);

  } catch (err) {
    console.error(err);
    document.body.classList.remove('speaking');
    setIdle();
    showNotif('⚠ ERRORE DI RETE');
  }
}

// === TTS ===
let currentAudio = null;

async function speak(text) {
  isSpeaking = true;
  document.body.classList.add('speaking');
  document.getElementById('stateLabel').textContent = 'NOVA RISPONDE...';

  const clean = text.replace(/\*\*/g,'').replace(/\*/g,'').replace(/#{1,6}\s/g,'').replace(/`/g,'');
  const elevenKey = localStorage.getItem('nova_eleven_key') || '';

  if (elevenKey) {
    try {
      // Giulia - voce italiana naturale ElevenLabs
      const voiceId = 'MF3mGyEYCl7XYWbV9V6O';
      const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: 'POST',
        headers: { 'xi-api-key': elevenKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: clean,
          model_id: 'eleven_multilingual_v2',
          voice_settings: { stability: 0.5, similarity_boost: 0.8, style: 0.3, use_speaker_boost: true }
        })
      });
      if (!res.ok) throw new Error('ElevenLabs error ' + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      currentAudio = new Audio(url);
      currentAudio.playbackRate = speechRate;
      currentAudio.onended = () => { isSpeaking = false; document.body.classList.remove('speaking'); setIdle(); URL.revokeObjectURL(url); };
      currentAudio.onerror = () => { isSpeaking = false; document.body.classList.remove('speaking'); setIdle(); };
      currentAudio.play();
      return;
    } catch(e) {
      console.warn('ElevenLabs fallback:', e);
      showNotif('⚠ ELEVENLABS ERROR — FALLBACK VOCE');
    }
  }

  // Fallback browser TTS
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(clean);
  if (selectedVoice) utter.voice = selectedVoice;
  utter.rate = speechRate; utter.pitch = 0.9; utter.volume = 1; utter.lang = 'it-IT';
  utter.onend = () => { isSpeaking = false; document.body.classList.remove('speaking'); setIdle(); };
  utter.onerror = () => { isSpeaking = false; document.body.classList.remove('speaking'); setIdle(); };
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function stopSpeaking() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  window.speechSynthesis.cancel();
  isSpeaking = false;
  document.body.classList.remove('speaking');
  setIdle();
}

// === UI HELPERS ===
function showTranscript(role, text, type) {
  const box = document.getElementById('transcriptBox');
  box.innerHTML = `<span class="transcript-${type === 'user' ? 'user' : 'nova'}"><b>${role}:</b> ${escapeHtml(text)}</span>`;
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showNotif(msg) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 2500);
}

// === HISTORY ===
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if (conversationHistory.length === 0) {
    list.innerHTML = '<span style="color:var(--text-dim);font-size:11px;padding:10px">Nessuna conversazione registrata.</span>';
    return;
  }
  conversationHistory.forEach(msg => {
    const div = document.createElement('div');
    div.className = `history-item ${msg.role}`;
    div.innerHTML = `<div class="hi-role">${msg.role === 'user' ? '◆ Tu' : '◈ NOVA'}</div>${escapeHtml(msg.content)}`;
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}

function saveHistory() {
  try { localStorage.setItem('nova_history', JSON.stringify(conversationHistory)); } catch(e) {}
}

function clearHistory() {
  if (!confirm('Cancellare tutta la memoria di NOVA?')) return;
  conversationHistory = [];
  localStorage.removeItem('nova_history');
  renderHistory();
  showNotif('MEMORIA CANCELLATA');
}

function toggleHistory() {
  document.getElementById('historyPanel').classList.toggle('open');
  if (document.getElementById('historyPanel').classList.contains('open')) renderHistory();
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

function saveSettings() {
  const key = document.getElementById('settingsKey').value.trim();
  const elevenKey = document.getElementById('settingsElevenKey').value.trim();
  const pers = document.getElementById('settingsPersonality').value.trim();
  const speed = document.getElementById('settingsSpeed').value;
  const voiceIdx = document.getElementById('settingsVoice').value;

  if (key) { apiKey = key; localStorage.setItem('nova_key', key); }
  if (elevenKey) localStorage.setItem('nova_eleven_key', elevenKey);
  personality = pers;
  speechRate = parseFloat(speed);
  localStorage.setItem('nova_personality', pers);
  localStorage.setItem('nova_speed', speed);

  const voices = window.speechSynthesis.getVoices();
  const italianVoices = voices.filter(v => v.lang.startsWith('it'));
  const pool = italianVoices.length > 0 ? italianVoices : voices;
  if (pool[voiceIdx]) {
    selectedVoice = pool[voiceIdx];
    localStorage.setItem('nova_voice_idx', voiceIdx);
  }

  toggleSettings();
  showNotif('◈ CONFIG SALVATA');
}

// === BLUETOOTH / SMARTIA ===
async function requestBluetooth() {
  showNotif('SMARTIA: USA BT AUDIO DEL TELEFONO');
  // Gli Smartia si comportano come cuffie BT standard.
  // L'utente deve solo collegare gli occhiali nelle impostazioni BT del telefono.
  // NOVA userà automaticamente il mic/speaker attivo.
  speak('Connetti gli Smartia dal menu Bluetooth del telefono. Poi NOVA userà automaticamente il loro microfono e altoparlante.');
}

// Long press support for mic button
const btnMic = document.getElementById('btnMic');
let pressTimer = null;

btnMic.addEventListener('touchstart', (e) => {
  e.preventDefault();
  pressTimer = setTimeout(() => startListening(), 100);
});

btnMic.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (pressTimer) clearTimeout(pressTimer);
  if (isListening) setTimeout(stopListening, 500);
});

btnMic.addEventListener('mousedown', () => startListening());
btnMic.addEventListener('mouseup', () => { if(isListening) setTimeout(stopListening, 500); });

init();
</script>
